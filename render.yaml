services:
  - type: web
    name: re-style-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TINYFISH_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
