name: CI & Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: TypeScript Typecheck & Build Frontend
      run: npm run build

    - name: Verify Backend Integrity
      run: node -e "import('./server.js').then(() => console.log('Backend syntax valid')).catch(e => { console.error(e); process.exit(1); })"
